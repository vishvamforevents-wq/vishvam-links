<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vishvam Events & Foods | Connect</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(145deg,#120d08,#3b250d 50%,#120d08);font-family:Arial,Helvetica,sans-serif;color:#25190a}
.wrap{max-width:480px;margin:auto;padding:14px}
.panel{background:#fffdf8;border:2px solid #c79a38;border-radius:26px;padding:16px 15px 18px;box-shadow:0 14px 42px rgba(0,0,0,.42)}
.logo{display:block;width:155px;height:155px;object-fit:cover;border-radius:50%;margin:2px auto 10px;border:4px solid #c79a38;box-shadow:0 5px 16px rgba(0,0,0,.22)}
h1{font:700 25px Georgia,serif;text-align:center;color:#8b5e12;margin:4px 0}
.tag{text-align:center;color:#5b4a2c;font-size:13px;margin:5px 0 16px}
.links{display:grid;gap:9px}
.card{display:flex;align-items:center;gap:12px;text-decoration:none;color:#25190a;background:#fff;border:1px solid #e0c47a;border-radius:15px;padding:10px 12px}
.icon{width:42px;height:42px;border-radius:12px;background:#f5e9cc;display:grid;place-items:center;color:#9a6a12;flex:none}
.icon svg{width:24px;height:24px;display:block}
.copy{display:flex;flex-direction:column;gap:2px;min-width:0}
.copy strong{font-size:15px;color:#6f480d}
.copy small{font-size:11.5px;color:#675a47;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arrow{margin-left:auto;font-size:26px;color:#b88920}
.footer{text-align:center;color:#76551f;font:13px Georgia,serif;margin-top:14px}
  .qr-section{
  margin:18px 0 8px;
  padding:16px 14px 12px;
  text-align:center;
  background:#fffdf8;
  border:1.5px solid #d9bd70;
  border-radius:18px;
  box-shadow:0 4px 14px rgba(90,60,15,.12);
}

.qr-section img{
  display:block;
  width:190px;
  height:190px;
  margin:0 auto 8px;
  border-radius:12px;
}

.qr-section p{
  margin:0;
  font-size:12px;
  font-weight:600;
  color:#76551f;
}
</style>
